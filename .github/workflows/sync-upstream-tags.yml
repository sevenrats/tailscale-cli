# GitHub Actions: check for new Tailscale releases every 24 hours and
# generate missing model packages.  Opens a PR when new versions are found.
#
# Can also be triggered manually via workflow_dispatch.

name: sync-upstream-tags

on:
  schedule:
    # Every day at 06:00 UTC
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # full history so we can create meaningful commits

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install tomli

      - name: Generate missing upstream tags
        id: codegen
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          python -m codegen --sync-tags 2>&1 | tee sync-output.txt
          exit_code=${PIPESTATUS[0]}

          # Determine if any files were generated
          if git diff --quiet && [ -z "$(git ls-files --others --exclude-standard)" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"

            # Build a list of new tags for the PR description
            new_tags=$(grep "^  ✓ Wrote" sync-output.txt \
              | sed 's|.*tailscale_cli/\(v[^/]*\)/.*|\1|' \
              | sort -u \
              | tr '\n' ' ')
            echo "new_tags=${new_tags}" >> "$GITHUB_OUTPUT"
          fi

          exit $exit_code

      - name: Create Pull Request
        if: steps.codegen.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "codegen: add models for new upstream tags"
          branch: codegen/sync-upstream-tags
          delete-branch: true
          title: "codegen: new upstream Tailscale releases"
          body: |
            Automated sync detected new Tailscale release tags and generated
            the corresponding Python model packages.

            **New version packages:** ${{ steps.codegen.outputs.new_tags }}

            Generated by `python -m codegen --sync-tags`.
          labels: |
            codegen
            automated
